<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fix My Street — Admin</title>
<style>
  :root{
    --bg:#0f0a1a; --bg2:#1a0f2e; --card:#1e1533; --card2:#241b3d;
    --purple:#8b3cf0; --pink:#ec4899; --grad:linear-gradient(135deg,#8b3cf0,#ec4899);
    --text:#f5f3fa; --muted:#b8b0cc; --muted2:#8f86a8;
    --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
    --border:#332a52; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:rgba(20,14,36,0.95);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;}
  header .who{font-size:13px;color:var(--muted);}
  header .who strong{color:var(--text);}
  header .who button{margin-left:12px;background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;}
  .container{max-width:1200px;margin:0 auto;padding:24px 20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;}
  .stat{background:var(--bg2);border-radius:10px;padding:16px;text-align:center;}
  .stat .num{font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat .lbl{font-size:11px;color:var(--muted2);margin-top:4px;text-transform:uppercase;letter-spacing:.03em;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  select, input[type=text]{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg2);color:var(--text);}
  select:focus, input:focus{outline:none;border-color:var(--purple);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:10px;background:var(--bg2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  th:first-child{border-radius:8px 0 0 8px;} th:last-child{border-radius:0 8px 8px 0;}
  td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr.data-row:hover{background:var(--card2);cursor:pointer;}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .badge.low{background:rgba(34,197,94,.15);color:var(--green);}
  .badge.medium{background:rgba(245,158,11,.15);color:var(--amber);}
  .badge.high{background:rgba(239,68,68,.15);color:var(--red);}
  .badge.critical{background:var(--red);color:#fff;}
  .status-pill{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(139,60,240,.18);color:#c99bfb;}
  .safety-flag{color:var(--red);font-weight:700;}
  .btn{background:var(--grad);color:#fff;border:none;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn:hover{opacity:.9;}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:560px;width:92%;max-height:88vh;overflow-y:auto;padding:24px;}
  .modal img{max-width:100%;border-radius:10px;margin:10px 0;}
  .timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--border);margin-left:9px;}
  .timeline li{position:relative;padding:10px 0 10px 22px;}
  .timeline li::before{content:'';position:absolute;left:-8px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--grad);border:2px solid var(--card);}
  .timeline .ts{color:var(--muted2);font-size:12px;margin-top:2px;}
  .close-x{float:right;cursor:pointer;font-size:20px;color:var(--muted);}
  .row-actions{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  textarea{width:100%;min-height:60px;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;background:var(--bg2);color:var(--text);margin-top:10px;}
  .hidden{display:none;}
  .login-wrap{max-width:380px;margin:100px auto;}
  .login-wrap input{width:100%;margin-bottom:10px;padding:11px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);}
  .error{color:var(--red);font-size:13px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);padding:8px 12px;border-radius:8px;}
  .pagination{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;align-items:center;font-size:13px;color:var(--muted);}
  h2{margin-top:0;}
  .nearby-badge{font-size:11px;color:#c99bfb;background:rgba(139,60,240,.15);padding:2px 8px;border-radius:10px;margin-left:6px;}
</style>
</head>
<body>

<div id="view-login" class="container login-wrap">
  <div class="card">
    <div class="brand" style="margin-bottom:16px;"><span class="logo">F</span> Fix My Street — Admin</div>
    <input type="text" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <div id="loginError" class="error hidden"></div>
    <button class="btn" id="loginBtn" style="width:100%;margin-top:6px;">Sign in</button>
  </div>
</div>

<div id="view-dashboard" class="hidden">
  <header>
    <div class="brand"><span class="logo">F</span> Fix My Street — Admin</div>
    <div class="who">
      Signed in as <strong id="whoName"></strong> (<span id="whoDept"></span>)
      <button id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div class="stats" id="statsBox"></div>
    </div>

    <div class="card">
      <div class="filters">
        <input type="text" id="qFilter" placeholder="Search description or tracking code" />
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="submitted">Submitted</option>
          <option value="under_review">Under Review</option>
          <option value="assigned">Assigned</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
          <option value="rejected">Rejected</option>
          <option value="duplicate">Duplicate</option>
        </select>
        <select id="deptFilter">
          <option value="">All departments</option>
          <option value="roads_and_transportation">Roads & Transportation</option>
          <option value="street_lighting">Street Lighting</option>
          <option value="sidewalks_and_accessibility">Sidewalks & Accessibility</option>
          <option value="signage">Signage</option>
          <option value="sanitation">Sanitation</option>
          <option value="public_works_general">Public Works (General)</option>
        </select>
        <select id="severityFilter">
          <option value="">All severities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
        <select id="safetyFilter">
          <option value="">All reports</option>
          <option value="true">Safety risk only</option>
        </select>
        <button class="btn secondary" id="applyFiltersBtn">Apply</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Code</th><th>Category</th><th>Severity</th><th>Department</th><th>Status</th><th>Reported</th><th></th>
          </tr>
        </thead>
        <tbody id="reportsTbody"></tbody>
      </table>
      <div class="pagination">
        <button class="btn secondary" id="prevPageBtn">◀ Prev</button>
        <span id="pageLabel"></span>
        <button class="btn secondary" id="nextPageBtn">Next ▶</button>
      </div>
    </div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modalContent"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
